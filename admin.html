<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול · קהילת אור השרון</title>
  <meta name="robots" content="noindex">
  <script src="theme.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Noto+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=57">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img class="logo" src="logo.png" alt="" width="64" height="64">
        <div><h1>קהילת אור השרון · ניהול</h1></div>
      </div>
      <nav class="adm-nav"><a href="/">לאתר</a><button class="link-btn" id="adm-out" hidden>יציאה</button></nav>
    </div>
  </header>
  <main class="wrap adm">
    <p id="adm-status" class="adm-hint">טוען…</p>
    <div id="sa-report" class="sa-report" hidden></div>
    <div id="adm-login" class="adm-box" hidden>
      <h2>כניסת מנהל</h2>
      <p class="adm-hint">כניסה עם חשבון ה-Gmail של המנהלים.</p>
      <button class="adm-btn" id="adm-google">כניסה עם Google</button>
    </div>
    <section id="site-access" class="adm-box" hidden></section>
    <section id="adm-admins" class="adm-box" hidden></section>
  </main>
  <div id="adm-toast" class="adm-toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="site-access.js?v=5"></script>
  <script>
    const sb = window.supabase.createClient("https://pualpwrkztjzhgpaqudm.supabase.co", "sb_publishable_TFMMqLxLWHatd3lXYrUlTQ_aO7MvaQ9", { db: { schema: "or_hasharon_worship" } });
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const $ = (id) => document.getElementById(id);
    let user = null, toastT = 0;
    function toast(t) { const el = $("adm-toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2600); }
    const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

    // "site" = started from the entry screen's 'כניסת מנהל' (after signing in → the site itself);
    // "admin" = started on this page (stay here). Either way the site root sends Google's answer back here (index.html).
    function googleSignIn(from) {
      store("oh-admin-login", from);
      sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/admin.html" } });
    }
    $("adm-google").addEventListener("click", () => googleSignIn("admin"));
    $("adm-out").addEventListener("click", async () => { await sb.auth.signOut(); store("oh-access", null); location.reload(); });

    // ---------- managers (who may sign in here) ----------
    // each admin: Gmail (signs in here) + name (shown on the entry screen's "נא פנה לאדמין") + phone (required: enters the
    // site by phone too; it's also put on the entry list). Names/phones need site_admins.sql; until then only e-mails.
    let admins = [], namesReady = false;
    let siteAdminPhones = new Set(); // site-access.js leaves these out of the "more than one device" report
    async function loadAdmins() {
      let { data, error } = await sb.from("allowed_users").select("email, is_admin, display_name, phone").eq("is_admin", true).order("email");
      namesReady = !error;
      if (error) ({ data } = await sb.from("allowed_users").select("email, is_admin").eq("is_admin", true).order("email"));
      admins = data || [];
      siteAdminPhones = new Set(admins.map((a) => normPhone(a.phone)).filter((p) => p.length >= 9));
    }
    function renderAdmins() {
      const me = (user?.email || "").toLowerCase();
      const missing = namesReady ? admins.filter((a) => normPhone(a.phone).length < 9) : [];
      $("adm-admins").innerHTML = `<h2>מנהלים</h2>
        <p class="adm-hint">מנהלים נכנסים כאן עם Gmail, ונכנסים לאתר גם עם מספר הטלפון שלהם. השמות מופיעים למי שהמספר שלו לא ברשימה: "נא פנה לאדמין: …".</p>
        ${namesReady ? "" : `<p class="db-warning">כדי לשמור שם וטלפון למנהלים, צריך להריץ ב-Supabase את <b dir="ltr">site_admins.sql</b>.</p>`}
        ${missing.length ? `<p class="sa-alert" role="alert">⚠ חסר מספר טלפון ל: ${missing.map((a) => esc(a.display_name || a.email)).join(", ")}</p>` : ""}
        <ul class="adm-list">${admins.map((a) => `<li>${namesReady ? `<input class="adm-name" data-adm-name="${esc(a.email)}" value="${esc(a.display_name || "")}" placeholder="שם">
          <input class="adm-name adm-phone${normPhone(a.phone).length < 9 ? " adm-missing" : ""}" type="tel" dir="ltr" data-adm-phone="${esc(a.email)}" value="${esc(a.phone ? fmtPhone(normPhone(a.phone)) : "")}" placeholder="טלפון (חובה)"> ` : ""}<span dir="ltr">${esc(a.email)}</span>${a.email.toLowerCase() === me ? " (את/ה)" : ` <button class="link-btn" data-adm-del="${esc(a.email)}">הסרה</button>`}</li>`).join("")}</ul>
        <form class="adm-form" id="adm-add">${namesReady ? `<input name="name" required placeholder="שם"><input name="phone" type="tel" required dir="ltr" placeholder="טלפון (חובה)">` : ""}<input name="email" type="email" required dir="ltr" placeholder="name@gmail.com"><button class="adm-btn" type="submit">הוספת מנהל/ת</button></form>`;
    }
    // an admin's phone also goes on the entry list (so it shows with its entries); an existing row stays as it is
    async function adminPhoneToList(phone, name) {
      const { error } = await sb.from("site_phones").insert({ phone, name, added_by: user?.email || null });
      if (!error || error.code === "23505") { await loadSiteAccess(); renderSiteAccess(); }
    }
    document.addEventListener("submit", async (e) => {
      if (e.target.id !== "adm-add") return;
      e.preventDefault();
      const f = new FormData(e.target), email = f.get("email").trim().toLowerCase(), name = (f.get("name") || "").trim();
      const phone = normPhone(f.get("phone") || "");
      if (namesReady && (phone.length < 9 || phone.length > 12)) { toast("צריך מספר טלפון תקין למנהל/ת"); return; }
      const row = { is_admin: true, ...(namesReady ? { display_name: name, phone } : {}) };
      let { error } = await sb.from("allowed_users").insert({ email, ...row });
      if (error?.code === "23505") ({ error } = await sb.from("allowed_users").update(row).eq("email", email));
      toast(error ? "ההוספה נכשלה" : `${name || email} נוסף/ה כמנהל/ת`);
      await loadAdmins(); renderAdmins();
      if (!error && namesReady) await adminPhoneToList(phone, name);
    });
    document.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-adm-del]");
      if (!b || !confirm(`להסיר את ${b.dataset.admDel} מהמנהלים?`)) return;
      const { error } = await sb.from("allowed_users").update({ is_admin: false }).eq("email", b.dataset.admDel);
      toast(error ? "ההסרה נכשלה" : "הוסר/ה");
      await loadAdmins(); renderAdmins();
    });

    let started = false;
    document.addEventListener("change", async (e) => {
      const n = e.target.closest("[data-adm-name]"), ph = e.target.closest("[data-adm-phone]");
      if (n) {
        const { error } = await sb.from("allowed_users").update({ display_name: n.value.trim() || null }).eq("email", n.dataset.admName);
        toast(error ? "השמירה נכשלה" : "השם נשמר");
        if (!error) { const a = admins.find((x) => x.email === n.dataset.admName); if (a) a.display_name = n.value.trim(); }
      } else if (ph) {
        const phone = normPhone(ph.value), a = admins.find((x) => x.email === ph.dataset.admPhone);
        if (phone.length < 9 || phone.length > 12) { toast("מספר הטלפון חובה ולא תקין"); ph.value = a?.phone ? fmtPhone(normPhone(a.phone)) : ""; return; }
        const { error } = await sb.from("allowed_users").update({ phone }).eq("email", ph.dataset.admPhone);
        toast(error ? "השמירה נכשלה" : "הטלפון נשמר");
        if (!error) { if (a) a.phone = phone; siteAdminPhones.add(phone); await adminPhoneToList(phone, a?.display_name || ""); renderAdmins(); }
      }
    });

    async function start() {
      if (started) return; started = true;
      const { data: { session } } = await sb.auth.getSession();
      user = session?.user || null;
      if (!user) {
        if (new URLSearchParams(location.search).has("login")) { $("adm-status").textContent = "עובר לכניסה עם Google…"; googleSignIn("site"); return; }
        $("adm-status").hidden = true; $("adm-login").hidden = false; return;
      }
      let from = null; try { from = localStorage.getItem("oh-admin-login"); } catch {}
      store("oh-admin-login", null);
      $("adm-out").hidden = false;
      const { data: isAdmin, error } = await sb.rpc("is_admin");
      if (error || !isAdmin) {
        if (!error) store("oh-access", null); // not an admin (any more): no free pass into the site on this device
        $("adm-status").innerHTML = `החשבון <b dir="ltr">${esc(user.email)}</b> אינו מנהל באתר. אפשר לצאת ולהיכנס עם חשבון אחר.`;
        return;
      }
      store("oh-access", "admin"); // an admin enters the site without a phone number (gate.js)
      if (from === "site" || new URLSearchParams(location.search).has("login")) { location.replace("/"); return; } // signed in from the entry screen: to the site
      $("adm-status").innerHTML = `מחובר/ת כ-<b dir="ltr">${esc(user.email)}</b>`;
      $("site-access").hidden = false; $("adm-admins").hidden = false;
      $("sa-report").hidden = false;
      await loadAdmins(); renderAdmins();
      renderSiteAccess();
    }
    sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !user) { started = false; start(); } });
    start();
  </script>
</body>
</html>
