<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>החלפת תורנות · קהילת אור השרון</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="בקשת החלפת תורנות · קהילת אור השרון">
  <meta property="og:description" content="אישור או סירוב בלחיצה — השיבוץ באתר מתעדכן לבד">
  <meta property="og:image" content="https://orhasharon.github.io/logo.png">
  <script src="theme.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Noto+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=61">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
</head>
<body>
  <main class="wrap swap-page">
    <h1>החלפת תורנות</h1>
    <div id="box" class="swap-card"><p class="adm-hint">טוען…</p></div>
    <p class="swap-back"><a href="/">← לאתר הקהילה</a></p>
  </main>
  <script src="schedule.js?v=38"></script>
  <script>
    // The other team answers a swap request (duty.sql: duty_swap_view / duty_swap_answer). One-time link, no sign-in.
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const box = document.getElementById("box");
    const t = new URLSearchParams(location.search).get("s") || "";
    const dd = (iso) => iso ? iso.split("-").reverse().slice(0, 2).join("/") : "";
    const day = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("he-IL", { weekday: "long" });
    const waIntl = (p) => { const d = String(p || "").replace(/\D/g, ""); return d.startsWith("0") ? "972" + d.slice(1) : d; };
    let req = null;

    const show = (html) => { box.innerHTML = html; };
    function render() {
      const r = req;
      const head = `<p class="swap-lead"><b>${esc(r.req_name || "מישהו מהצוות")}</b> מבקש/ת להתחלף איתכם בתורנות:</p>
        <div class="swap-dates">
          <div><small>אתם תהיו ב</small><strong>${day(r.from_date)} ${dd(r.from_date)}</strong><small>במקום ${esc(r.from_team)}</small></div>
          <div><small>ו-${esc(r.from_team)} יהיו ב</small><strong>${day(r.to_date)} ${dd(r.to_date)}</strong><small>במקומכם (${esc(r.to_team)})</small></div>
        </div>`;
      if (r.status === "pending") return show(head + `<div class="swap-actions">
          <button class="btn" data-a="yes">✓ מאשרים את ההחלפה</button>
          <button class="btn ghost" data-a="no">לא מתאים לנו</button></div>`);
      const msg = { approved: "ההחלפה אושרה ✓ השיבוץ באתר כבר מעודכן.", declined: "הבקשה נדחתה.", cancelled: "הבקשה בוטלה.", expired: "הבקשה פגה — אחד התאריכים כבר עבר." }[r.status] || "";
      show(head + `<p class="swap-done">${msg}</p>` + (r.notify || ""));
    }

    async function start() {
      if (!/^[0-9a-f-]{36}$/i.test(t)) return show(`<p>הלינק לא תקין.</p>`);
      try {
        req = await dutyRpc("duty_swap_view", { t });
        if (!req) return show(`<p>הבקשה לא נמצאה.</p>`);
        render();
      } catch { show(`<p>החלפת תורנות עדיין לא פעילה באתר. פנו למיכל.</p>`); }
    }
    box.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-a]");
      if (!b) return;
      box.querySelectorAll("button").forEach((x) => (x.disabled = true));
      try {
        const r = await dutyRpc("duty_swap_answer", { t, yes: b.dataset.a === "yes" });
        if (r.error) { req.status = r.status || (r.error === "expired" ? "expired" : req.status); render(); return; }
        req.status = r.status;
        const yes = r.status === "approved";
        const text = yes ? `היי ${(r.req_name || "").split(" ")[0]}, אישרנו את ההחלפה ✓ אנחנו ב-${dd(r.from_date)} ואתם ב-${dd(r.to_date)}. השיבוץ באתר מעודכן.`
                         : `היי ${(r.req_name || "").split(" ")[0]}, לצערנו לא מתאים לנו להתחלף הפעם. אולי מישהו אחר מהרשימה?`;
        req.notify = r.req_phone ? `<p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${waIntl(r.req_phone)}?text=${encodeURIComponent(text)}">לעדכן את ${esc(r.req_name || "")} בוואטסאפ</a></p>` : "";
        render();
      } catch { box.querySelectorAll("button").forEach((x) => (x.disabled = false)); alert("לא הצלחתי לשמור. בדקו חיבור ונסו שוב."); }
    });
    start();
  </script>
</body>
</html>
