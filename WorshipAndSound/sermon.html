<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>העלאת המסר · אור השרון</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="העלאת המסר · קהילת אור השרון">
  <meta property="og:description" content="מעלים את מצגת הדרשה (PowerPoint או PDF), והיא נכנסת לבד למצגת האסיפה">
  <meta property="og:image" content="https://orhasharon.github.io/logo.png">
  <script src="../theme.js?v=1"></script>
  <script src="../icons.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Noto+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="stylesheet" href="../style.css?v=49">
  <link rel="stylesheet" href="ws.css?v=84">
  <style>
    /* The speaker's page: one job — upload the sermon PDF for one meeting. */
    .up { max-width: 460px; margin: 0 auto; padding: 28px 16px 40px; }
    .up h1 { font: 500 1.6rem/1.25 "Google Sans", "Noto Sans Hebrew", sans-serif; letter-spacing: .03em; margin: 0 0 4px; color: var(--accent-ink); }
    .up .when { margin: 0 0 18px; color: var(--muted); }
    .up-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
    .up-now { margin: 0; }
    .up-now.ok { color: var(--hallel); font-weight: 600; }
    .up-drop { display: grid; place-items: center; gap: 6px; min-height: 150px; border: 2px dashed var(--line); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; }
    .up-drop.over { border-color: var(--accent); background: rgba(200, 150, 58, .08); }
    .up-drop .big { font-size: 1.1rem; font-weight: 700; }
    .up-drop small { color: var(--muted); }
    .up-pick { min-height: 48px; padding: 8px 22px; border-radius: 10px; border: 0; background: var(--accent); color: #1b1408; font: inherit; font-weight: 700; cursor: pointer; }
    .up-msg { margin: 0; min-height: 1.4em; }
    .up-msg.err { color: #b3261e; font-weight: 600; }
    .up-msg.done { color: var(--hallel); font-weight: 700; font-size: 1.05rem; }
    .spin { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-inline-end-color: transparent; border-radius: 50%; vertical-align: -.15em; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
    .up-help { color: var(--muted); font-size: .9rem; margin: 0; }
  </style>
</head>
<body>
  <main class="up">
    <h1>העלאת מצגת הדרשה</h1>
    <p class="when" id="when">טוען…</p>
    <div class="up-card" id="card" hidden>
      <p class="up-now" id="now"></p>
      <label class="up-drop" id="drop">
        <span class="big">בחירת מצגת הדרשה</span>
        <small>או גרירה של הקובץ לכאן</small>
        <span class="up-pick" aria-hidden="true">📽️ בחירת קובץ</span>
        <input type="file" id="file" accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/pdf,.pdf" hidden>
      </label>
      <p class="up-msg" id="msg" role="status" aria-live="polite"></p>
      <p class="up-help">מעלים את קובץ ה-<b>PowerPoint</b> (‎.pptx) כמו שהוא: הוא נכנס למצגת האסיפה אחרי שקופית "דרשה", עם העיצוב והאנימציות שלו. אפשר גם PDF. עד 50MB. אפשר להעלות שוב כדי להחליף.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB = "https://pualpwrkztjzhgpaqudm.supabase.co", KEY = "sb_publishable_TFMMqLxLWHatd3lXYrUlTQ_aO7MvaQ9";
    const sb = window.supabase.createClient(SB, KEY, { db: { schema: "or_hasharon_worship" } });
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const t = new URLSearchParams(location.search).get("t") || "";
    const MAX = 50 * 1024 * 1024;
    let busy = false;

    const say = (html, cls = "") => { $("msg").className = "up-msg" + (cls ? " " + cls : ""); $("msg").innerHTML = html; };
    const when = (ts) => new Date(ts).toLocaleString("he-IL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    function showNow(name, at) {
      $("now").className = "up-now" + (name ? " ok" : "");
      $("now").textContent = name ? `✓ כבר הועלה: ${name} · ${when(at)}` : "עוד לא הועלה קובץ למפגש הזה.";
      $("drop").querySelector(".big").textContent = name ? "החלפת הקובץ" : "בחירת מצגת הדרשה";
    }

    async function start() {
      if (!/^[0-9a-f-]{36}$/i.test(t)) { $("when").textContent = "הלינק לא תקין. בקשו לינק חדש ממוביל/ת ההלל."; return; }
      const { data, error } = await sb.rpc("sermon_info", { t });
      if (error) { $("when").textContent = "העלאת המסר עדיין לא פעילה באתר. נסו שוב מאוחר יותר או שלחו את הקובץ למוביל/ת ההלל."; return; }
      const r = data?.[0];
      if (!r) { $("when").textContent = "הלינק פג או לא קיים. בקשו לינק חדש ממוביל/ת ההלל."; return; }
      const d = new Date(r.meeting_date + "T12:00:00");
      $("when").textContent = `ל${d.toLocaleDateString("he-IL", { weekday: "long" })} ${r.meeting_date.split("-").reverse().slice(0, 2).join("/")}`;
      document.title = `העלאת המסר · ${r.meeting_date.split("-").reverse().slice(0, 2).join("/")} · אור השרון`;
      showNow(r.file_name, r.uploaded_at);
      $("card").hidden = false;
    }

    async function upload(file) {
      if (busy || !file) return;
      const kind = /\.pptx$/i.test(file.name) ? "pptx" : /pdf$/i.test(file.type || file.name) ? "pdf" : "";
      if (!kind) { say("צריך קובץ PowerPoint (‎.pptx) או PDF.", "err"); return; }
      if (file.size > MAX) { say(`הקובץ גדול מדי (${Math.round(file.size / 1048576)}MB). עד 50MB. ב-PowerPoint: קובץ ← דחיסת תמונות, ואז לנסות שוב.`, "err"); return; }
      busy = true;
      say(`<span class="spin"></span> מעלה את ${esc(file.name)}…${file.size > 10 * 1048576 ? " (קובץ גדול, זה יכול לקחת דקה)" : ""}`);
      try {
        const path = `${t}/${Date.now()}-sermon.${kind}`;
        const up = await sb.storage.from("sermons").upload(path, file, { contentType: kind === "pptx" ? "application/vnd.openxmlformats-officedocument.presentationml.presentation" : "application/pdf", upsert: false });
        if (up.error) throw up.error;
        const at = await sb.rpc("sermon_attach", { t, path, fname: file.name });
        if (at.error) throw at.error;
        showNow(file.name, new Date().toISOString());
        say("מצגת הדרשה הועלתה ✓ · היא נכנסת לבד למצגת האסיפה. תודה!", "done");
      } catch (err) {
        console.error(err);
        const denied = /row-level|policy|403|42501|expired|Unauthorized/i.test(String(err?.message || err?.statusCode || ""));
        say(denied ? "הלינק לא בתוקף. בקשו לינק חדש ממוביל/ת ההלל." : "ההעלאה נכשלה. בדקו את החיבור ונסו שוב.", "err");
      }
      busy = false;
      $("file").value = "";
    }

    $("file").addEventListener("change", (e) => upload(e.target.files[0]));
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => upload(e.dataTransfer?.files?.[0]));
    start();
  </script>
</body>
</html>
