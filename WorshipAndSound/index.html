<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img class="logo" src="../logo.png" alt="" width="64" height="64">
        <div>
          <h1>צוותי הלל וסאונד</h1>
          <p class="tagline verse">יְהִי שֵׁם יְהוָה מְבֹרָךְ; מֵעַתָּה וְעַד־עוֹלָם. מִמִּזְרַח־שֶׁמֶשׁ עַד־מְבוֹאוֹ; מְהֻלָּל שֵׁם יְהוָה</p>
        </div>
      </div>
      <div class="account"><span id="who"></span><a class="yt-link" href="../">לאתר הקהילה</a></div>
    </div>
  </header>

  <main class="wrap">
    <section id="login" class="login" hidden>
      <h2>כניסה לצוותי הלל וסאונד</h2>
      <p>כדי לראות ולערוך את השיבוצים צריך להתחבר עם חשבון ה-Gmail שלכם.</p>
      <button id="google" class="btn google-main" type="button">התחברות עם Google</button>
      <form id="pw-login" class="pw-login" hidden>
        <input type="email" name="email" required placeholder="name@gmail.com" dir="ltr" autocomplete="email">
        <input type="password" name="password" required minlength="6" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password">
        <div class="pw-actions">
          <button class="btn" type="submit" data-mode="in">כניסה</button>
          <button class="btn ghost" type="submit" data-mode="up">כניסה ראשונה: יצירת סיסמה</button>
        </div>
      </form>
      <button class="link-btn magic-toggle" id="magic-toggle" type="button" hidden>שכחתי סיסמה / כניסה עם קישור למייל</button>
      <form id="email-login" class="email-login" hidden>
        <input type="email" name="email" required placeholder="name@gmail.com" dir="ltr" autocomplete="email">
        <button class="btn" type="submit">שליחת קישור כניסה</button>
      </form>
      <p id="sent" class="sent" hidden></p>
      <p id="noaccess" class="noaccess" hidden></p>
    </section>


    <section id="hero" class="hero" hidden></section>

    <nav class="tabs" role="tablist" hidden>
      <button role="tab" data-tab="signup" aria-selected="true">שיבוץ</button>
      <button role="tab" data-tab="team" aria-selected="false">הצוות</button>
      <button role="tab" data-tab="songs" aria-selected="false">שירים</button>
      <button role="tab" data-tab="users" aria-selected="false" hidden>משתמשים</button>
    </nav>

    <section id="signup"></section>
    <button id="more" class="more" hidden>הצג עוד מפגשים</button>
    <section id="team" hidden></section>
    <section id="songs" hidden></section>
    <section id="users" hidden></section>
    <p id="status" class="status">טוען…</p>
  </main>

  <footer class="wrap footer"><a href="../">← חזרה לאתר קהילת אור השרון</a></footer>
