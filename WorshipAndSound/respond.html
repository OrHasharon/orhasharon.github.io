<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור שיבוץ · אור השרון</title>
  <meta name="robots" content="noindex">
  <script src="../theme.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="stylesheet" href="../style.css?v=43">
  <link rel="stylesheet" href="ws.css?v=48">
  <style>
    .respond { margin: 40px auto; max-width: 520px; text-align: center; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 22px; }
    .respond h2 { font-family: "Frank Ruhl Libre", serif; margin: 0 0 10px; color: var(--accent-ink); }
    .respond .what { font-size: 1.15rem; margin: 8px 0 18px; }
    .respond .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn.no { background: #b3261e; color: #fff; }
    .btn.wa { background: #25d366; color: #fff; text-decoration: none; display: inline-block; }
    .respond textarea { width: 100%; font: inherit; color: var(--ink); background: rgba(127,127,127,.08); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img class="logo" src="../logo.png" alt="" width="64" height="64">
        <div><h1>צוותי הלל וסאונד</h1><p class="tagline">אישור שיבוץ</p></div>
      </div>
    </div>
  </header>
  <main class="wrap"><section id="box" class="respond"><p class="status">טוען…</p></section></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB = "https://pualpwrkztjzhgpaqudm.supabase.co", KEY = "sb_publishable_TFMMqLxLWHatd3lXYrUlTQ_aO7MvaQ9";
    const INVITE_HOOK = ""; // same value as in ws.js
    const sb = window.supabase.createClient(SB, KEY, { db: { schema: "or_hasharon_worship" } });
    const ROLES = { leader: "הובלת הלל", musician: "נגינה / שירה", sound: "סאונד", setup: "הקמת סאונד" };
    const q = new URLSearchParams(location.search), t = q.get("t"), a = q.get("a");
    const box = document.getElementById("box");
    let inv = null;
    const waNumber = (p) => { const d = String(p || "").replace(/\D/g, ""); return d.startsWith("0") ? "972" + d.slice(1) : d; };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const notify = () => { if (INVITE_HOOK) fetch(INVITE_HOOK, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "answer", token: t }) }).catch(() => {}); };

    async function load() {
      const { data, error } = await sb.rpc("invite_details", { t });
      inv = data && data[0];
      if (error || !inv) { box.innerHTML = `<h2>ההזמנה לא נמצאה</h2><p>ייתכן שהשיבוץ בוטל באתר.</p>`; return; }
      const when = inv.meeting_date.split("-").reverse().join("/");
      const what = ROLES[inv.role] + (inv.instrument ? ` (${esc(inv.instrument)})` : "");
      if (inv.response) {
        box.innerHTML = `<h2>כבר ענית על ההזמנה</h2><p class="what">${when} · ${what}</p><p>${inv.response === "accepted" ? "אישרת את השיבוץ ✔" : "ביטלת את השיבוץ"}</p>
          <p><a href="./">לאתר השיבוצים</a></p>`;
        return;
      }
      box.innerHTML = `<h2>שלום ${esc(inv.member_name)}</h2>
        <p>${esc(inv.inviter_name || inv.invited_by || "מוביל/ת ההלל")} מזמין/ה אותך:</p>
        <p class="what"><b>${when}</b> · <b>${what}</b></p>
        <div class="row"><button class="btn" id="yes">✔ מאשר/ת</button><button class="btn no" id="no">✖ לא אוכל</button></div>
        <div id="why" hidden><textarea id="reason" rows="3" placeholder="למה לא תוכל/י? (יוצג למי ששיבץ)"></textarea><button class="btn no" id="send-no">שליחת ביטול</button></div>`;
      document.getElementById("yes").onclick = () => answer(true);
      document.getElementById("no").onclick = () => { document.getElementById("why").hidden = false; document.getElementById("reason").focus(); };
      document.getElementById("send-no").onclick = () => answer(false, document.getElementById("reason").value.trim());
      if (a === "yes") answer(true);
      if (a === "no") document.getElementById("no").click();
    }

    async function answer(accept, why = null) {
      box.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const { data, error } = await sb.rpc("respond_invite", { t, accept, why });
      if (error) { box.insertAdjacentHTML("beforeend", `<p class="status">משהו השתבש, נסו שוב</p>`); box.querySelectorAll("button").forEach((b) => (b.disabled = false)); return; }
      notify();
      // let the inviter know, from the answering person's own WhatsApp (one click)
      const when = inv.meeting_date.split("-").reverse().join("/");
      const msg = data === "accepted" ? `היי, אישרתי את השיבוץ ב-${when} ✔` : `היי, לא אוכל להגיע לשיבוץ ב-${when}.${why ? " הסיבה: " + why : ""}`;
      const tell = inv.inviter_phone ? `<p><a class="btn wa" href="https://wa.me/${waNumber(inv.inviter_phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">💬 לעדכן את ${esc(inv.inviter_name || "המזמין/ה")} בוואטסאפ</a></p>` : "";
      box.innerHTML = data === "accepted"
        ? `<h2>תודה! השיבוץ אושר ✔</h2><p>הוא מופיע באתר השיבוצים.</p>${tell}<p><a href="./">לאתר השיבוצים</a></p>`
        : data === "declined" ? `<h2>השיבוץ בוטל</h2><p>הוא הוסר מאתר השיבוצים.</p>${tell}`
        : data === "answered" ? `<h2>כבר ענית על ההזמנה</h2>`
        : `<h2>ההזמנה כבר לא פעילה</h2><p>ייתכן שהשיבוץ הוסר באתר.</p>`;
    }
    if (t) load(); else box.innerHTML = `<h2>קישור לא תקין</h2>`;
  </script>
</body>
</html>
