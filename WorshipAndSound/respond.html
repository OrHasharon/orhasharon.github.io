<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>אישור שיבוץ · אור השרון</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="אישור שיבוץ · צוותי הלל וסאונד">
  <meta property="og:description" content="יְהִי שֵׁם יְהוָה מְבֹרָךְ; מֵעַתָּה וְעַד־עוֹלָם. מִמִּזְרַח־שֶׁמֶשׁ עַד־מְבוֹאוֹ; מְהֻלָּל שֵׁם יְהוָה">
  <meta property="og:image" content="https://orhasharon.github.io/logo.png">
  <script src="../theme.js?v=1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500&family=Noto+Sans+Hebrew:wght@400..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="stylesheet" href="../style.css?v=43">
  <link rel="stylesheet" href="ws.css?v=71">
  <style>
    .respond { margin: 40px auto; max-width: 520px; text-align: center; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 22px; }
    .respond h2 { font-family: "Google Sans", "Noto Sans Hebrew", sans-serif; font-weight: 500; margin: 0 0 10px; color: var(--accent-ink); }
    .respond .what { font-size: 1.15rem; margin: 8px 0 18px; }
    .respond .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn.no { background: #b3261e; color: #fff; }
    .btn.wa { background: #25d366; color: #fff; text-decoration: none; display: inline-block; }
    .respond textarea { width: 100%; font: inherit; color: var(--ink); background: rgba(127,127,127,.08); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img class="logo" src="../logo.png" alt="" width="64" height="64">
        <div><h1>צוותי הלל וסאונד</h1><p class="tagline verse">יְהִי שֵׁם יְהוָה מְבֹרָךְ; מֵעַתָּה וְעַד־עוֹלָם. מִמִּזְרַח־שֶׁמֶשׁ עַד־מְבוֹאוֹ; מְהֻלָּל שֵׁם יְהוָה</p></div>
      </div>
    </div>
  </header>
  <main class="wrap"><section id="box" class="respond"><p class="status">טוען…</p></section></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SB = "https://pualpwrkztjzhgpaqudm.supabase.co", KEY = "sb_publishable_TFMMqLxLWHatd3lXYrUlTQ_aO7MvaQ9";
    const INVITE_HOOK = ""; // same value as in ws.js
    const sb = window.supabase.createClient(SB, KEY, { db: { schema: "or_hasharon_worship" } });
    const ROLES = { leader: "הובלת הלל", musician: "נגינה / שירה", sound: "סאונד", setup: "הקמת סאונד" };
    const q = new URLSearchParams(location.search), t = q.get("t"), a = q.get("a");
    const box = document.getElementById("box");
    let inv = null;
    const waNumber = (p) => { const d = String(p || "").replace(/\D/g, ""); return d.startsWith("0") ? "972" + d.slice(1) : d; };
    // the WhatsApp mark (Simple Icons, CC0) on every "send by WhatsApp" button
    const WA_ICON = `<svg class="wa-icon" viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true" focusable="false"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>`;
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const notify = () => { if (INVITE_HOOK) fetch(INVITE_HOOK, { method: "POST", mode: "no-cors", body: JSON.stringify({ type: "answer", token: t }) }).catch(() => {}); };

    async function load() {
      const { data, error } = await sb.rpc("invite_details", { t });
      inv = data && data[0];
      if (error || !inv) { box.innerHTML = `<h2>ההזמנה לא נמצאה</h2><p>ייתכן שהשיבוץ בוטל באתר.</p>`; return; }
      const when = inv.meeting_date.split("-").reverse().join("/");
      const what = ROLES[inv.role] + (inv.instrument ? ` (${esc(inv.instrument)})` : "");
      if (inv.response === "declined") {
        box.innerHTML = `<h2>השיבוץ בוטל</h2><p class="what">${when} · ${what}</p><p>כבר ביטלת את השיבוץ הזה. כדי לחזור, צריך לשבץ מחדש באתר.</p><p><a href="./">לאתר השיבוצים</a></p>`;
        return;
      }
      if (inv.response === "accepted") {
        // already confirmed: the confirm link just says so; the decline link still lets you cancel
        box.innerHTML = `<h2>השיבוץ מאושר ✔</h2><p class="what"><b>${when}</b> · <b>${what}</b></p>
          ${a === "no" ? "" : `<p>התוכניות השתנו?</p><div class="row"><button class="btn no" id="no">✖ לא אוכל בכל זאת</button></div>`}
          <div id="why"${a === "no" ? "" : " hidden"}><p>${a === "no" ? "לא תוכל/י בכל זאת?" : ""}</p><textarea id="reason" rows="3" placeholder="למה לא תוכל/י? (יוצג למי ששיבץ)"></textarea><button class="btn no" id="send-no">שליחת ביטול</button></div>`;
        document.getElementById("no")?.addEventListener("click", () => { document.getElementById("why").hidden = false; document.getElementById("reason").focus(); });
        document.getElementById("send-no").onclick = () => answer(false, document.getElementById("reason").value.trim());
        if (a === "no") document.getElementById("reason").focus();
        return;
      }
      box.innerHTML = `<h2>שלום ${esc(inv.member_name)}</h2>
        <p>${esc(inv.inviter_name || inv.invited_by || "מוביל/ת ההלל")} מזמין/ה אותך:</p>
        <p class="what"><b>${when}</b> · <b>${what}</b></p>
        ${a === "no" ? "" : `<div class="row"><button class="btn" id="yes">✔ מאשר/ת</button><button class="btn no" id="no">✖ לא אוכל</button></div>`}
        <div id="why"${a === "no" ? "" : " hidden"}><textarea id="reason" rows="3" placeholder="למה לא תוכל/י? (יוצג למי ששיבץ)"></textarea><button class="btn no" id="send-no">שליחת סירוב</button></div>`;
      document.getElementById("yes")?.addEventListener("click", () => answer(true));
      document.getElementById("no")?.addEventListener("click", () => { document.getElementById("why").hidden = false; document.getElementById("reason").focus(); });
      document.getElementById("send-no").onclick = () => answer(false, document.getElementById("reason").value.trim());
      if (a === "yes") answer(true);           // the confirm link confirms right away
      if (a === "no") document.getElementById("reason").focus();  // the decline link: only the reason box
    }

    async function answer(accept, why = null) {
      box.querySelectorAll("button").forEach((b) => (b.disabled = true));
      const { data, error } = await sb.rpc("respond_invite", { t, accept, why });
      if (error) { box.insertAdjacentHTML("beforeend", `<p class="status">משהו השתבש, נסו שוב</p>`); box.querySelectorAll("button").forEach((b) => (b.disabled = false)); return; }
      notify();
      // let the inviter know, from the answering person's own WhatsApp (one click)
      const when = inv.meeting_date.split("-").reverse().join("/");
      const msg = data === "accepted" ? `היי, אישרתי את השיבוץ ב-${when} ✔` : `היי, לא אוכל להגיע לשיבוץ ב-${when}.${why ? " הסיבה: " + why : ""}`;
      const tell = inv.inviter_phone ? `<p><a class="btn wa" href="https://wa.me/${waNumber(inv.inviter_phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${WA_ICON} לעדכן את ${esc(inv.inviter_name || "המזמין/ה")} בוואטסאפ</a></p>` : "";
      box.innerHTML = data === "accepted"
        ? `<h2>תודה! השיבוץ אושר ✔</h2><p>הוא מופיע באתר השיבוצים.</p>${tell}<p><a href="./">לאתר השיבוצים</a></p>`
        : data === "declined" ? `<h2>השיבוץ בוטל</h2><p>הוא הוסר מאתר השיבוצים.</p>${tell}`
        : data === "answered" ? `<h2>כבר ענית על ההזמנה</h2>`
        : `<h2>ההזמנה כבר לא פעילה</h2><p>ייתכן שהשיבוץ הוסר באתר.</p>`;
    }
    if (t) load(); else box.innerHTML = `<h2>קישור לא תקין</h2>`;
  </script>
</body>
</html>
