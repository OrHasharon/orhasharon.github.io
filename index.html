<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>קהילת אור השרון</title>
  <meta name="description" content="דרשות והלל מקהילת אור השרון">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23b8862f'/><path d='M5 16C11 7 20 8 27 21M5 16C11 25 20 24 27 11' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1>קהילת אור השרון</h1>
        <p class="tagline">דרשות והלל מאסיפות השבת</p>
      </div>
      <a class="yt-link" href="https://www.youtube.com/@%D7%A7%D7%94%D7%99%D7%9C%D7%AA%D7%90%D7%95%D7%A8%D7%94%D7%A9%D7%A8%D7%95%D7%9F" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>
        לערוץ ביוטיוב
      </a>
    </div>
  </header>

  <main class="wrap">
    <section id="latest" class="latest" aria-label="השבת האחרונה"></section>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="sermon" aria-selected="true">דרשות</button>
      <button role="tab" data-tab="hallel" aria-selected="false">הלל</button>
      <button role="tab" data-tab="series" aria-selected="false">סדרות</button>
    </nav>

    <div class="toolbar">
      <input id="search" type="search" placeholder="חיפוש לפי נושא, ספר או תאריך…" aria-label="חיפוש">
      <span id="count" class="count"></span>
    </div>

    <div id="chips" class="chips" hidden></div>
    <div id="grid" class="grid"></div>
    <button id="more" class="more" hidden>הצג עוד</button>
    <p id="status" class="status">טוען…</p>
  </main>

  <footer class="wrap footer">
    <span id="updated"></span>
  </footer>

  <dialog id="player">
    <div class="player-box">
      <button class="close" aria-label="סגירה">✕</button>
      <div class="frame"><iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="נגן וידאו"></iframe></div>
      <div class="player-meta">
        <h2 id="player-title"></h2>
        <p id="player-sub"></p>
        <a id="player-yt" target="_blank" rel="noopener">צפייה ביוטיוב ↗</a>
      </div>
    </div>
  </dialog>

  <script src="app.js?v=5"></script>
</body>
</html>
